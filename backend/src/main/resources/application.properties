server.port=${PORT:8080}
spring.application.name=price-compare-backend

# How long a captured price stays valid before it's considered stale (minutes).
# Menu prices and delivery fees change often, so old captures are dropped automatically.
pricecompare.entry-ttl-minutes=45

# Similarity threshold (0-1) used to decide whether two captured item names
# refer to the "same dish" across platforms. Higher = stricter matching.
pricecompare.match-threshold=0.55

logging.level.com.pricecompare=INFO
