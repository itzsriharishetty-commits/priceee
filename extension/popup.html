<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    width: 320px;
    margin: 0;
    background: #14161A;
    color: #EDEDEF;
    font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
  }
  header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #2A2E37;
  }
  header h1 { font-size: 15px; margin: 0 0 2px; }
  header p { margin: 0; color: #8B909A; font-size: 11.5px; }

  .section { padding: 12px 16px; border-bottom: 1px solid #2A2E37; }
  .section:last-child { border-bottom: none; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }

  button {
    background: #23262E;
    color: #EDEDEF;
    border: 1px solid #2A2E37;
    border-radius: 7px;
    padding: 8px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button.primary { background: #8B2CF5; border-color: #8B2CF5; color: #fff; }
  button.on { background: #34D399; border-color: #34D399; color: #0E0F12; }

  #status { font-size: 11px; color: #8B909A; }
  #status.ok { color: #34D399; }
  #status.err { color: #E23744; }

  #scanList {
    max-height: 220px;
    overflow-y: auto;
    margin-top: 8px;
  }
  .scan-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid #1C1F26;
    font-size: 12px;
  }
  .scan-item input[type="checkbox"] { margin-top: 2px; }
  .scan-item .name { flex: 1; }
  .scan-item .price { color: #34D399; font-family: monospace; font-weight: 700; }

  .muted { color: #8B909A; font-size: 11.5px; }
</style>
</head>
<body>

<header>
  <h1>🎯 Price Race</h1>
  <p id="platformLabel">Detecting platform…</p>
</header>

<div class="section">
  <div class="row">
    <span>Backend</span>
    <span id="status">checking…</span>
  </div>
  <div class="row">
    <button id="captureToggle">Loading…</button>
  </div>
  <p class="muted">When capture mode is on, click any dish/price on the page to send it — you'll get a small panel to fix the name/price before sending.</p>
</div>

<div class="section">
  <div class="row">
    <button id="scanBtn">🔍 Scan this page for prices</button>
  </div>
  <div id="scanList"></div>
  <div class="row" id="sendSelectedRow" style="display:none; margin-top:8px;">
    <button id="sendSelectedBtn" class="primary">Send selected</button>
  </div>
</div>

<div class="section">
  <button id="openDashboardBtn">Open Price Race dashboard ↗</button>
</div>

<script src="popup.js"></script>
</body>
</html>
